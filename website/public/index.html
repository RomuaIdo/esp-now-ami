<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>AMI Receiver · ESP-NOW</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <div class="ident">
            <strong>ESP-NOW AMI</strong>
            <span>Receptor master</span>
        </div>
        <dl class="spec">
            <div><dt>Codificação</dt><dd>AMI pseudo-ternário</dd></div>
            <div><dt>Cifra</dt><dd>XOR <code id="key-label"></code></dd></div>
            <div><dt>Baud</dt><dd>115200</dd></div>
        </dl>
        <div class="links" aria-live="polite">
            <span class="link" id="ws-status" data-state="off"><i class="led" aria-hidden="true"></i>WebSocket <output>desconectado</output></span>
            <span class="link" id="serial-status" data-state="off"><i class="led" aria-hidden="true"></i>Serial <output>desconectado</output></span>
        </div>
    </header>

    <main class="channels" id="channels"></main>

    <template id="channel-tpl">
        <section class="channel">
            <header class="channel-head">
                <span class="ch-tag"></span>
                <h2 class="ch-name"></h2>
                <dl class="ch-meta">
                    <div><dt>Pacotes</dt><dd data-f="count">0</dd></div>
                    <div><dt>Último</dt><dd data-f="ts">—</dd></div>
                </dl>
            </header>

            <div class="screen">
                <div class="screen-scroll"><canvas role="img"></canvas></div>
                <p class="cursor-readout" data-f="cursor">Passe o cursor sobre a forma de onda para medir um bit.</p>
            </div>

            <dl class="measure">
                <div><dt>Bits</dt><dd data-f="bits">—</dd></div>
                <div><dt>Bytes</dt><dd data-f="bytes">—</dd></div>
                <div><dt>Marcas +V</dt><dd data-f="pos">—</dd></div>
                <div><dt>Marcas −V</dt><dd data-f="neg">—</dd></div>
                <div><dt>Espaços 0 V</dt><dd data-f="zero">—</dd></div>
                <div><dt>Nível DC</dt><dd data-f="dc">—</dd></div>
                <div><dt>Violações</dt><dd data-f="viol">—</dd></div>
            </dl>

            <div class="decode">
                <div class="pipeline">
                    <div class="stage">
                        <h3>Bits recebidos</h3>
                        <pre class="mono dim" data-f="bitstr">—</pre>
                    </div>
                    <div class="stage">
                        <h3>Cifrado (hex)</h3>
                        <pre class="mono" data-f="hex">—</pre>
                    </div>
                    <div class="stage">
                        <h3>Cifrado (texto)</h3>
                        <pre class="mono" data-f="enc">—</pre>
                    </div>
                    <div class="stage result">
                        <h3>Mensagem decifrada</h3>
                        <pre class="mono" data-f="msg">—</pre>
                    </div>
                </div>
                <div class="table-wrap">
                    <table class="bytes">
                        <caption>Byte a byte: texto ⊕ chave = cifrado</caption>
                        <thead>
                            <tr><th>#</th><th>Txt</th><th>Hex</th><th>Chave</th><th>Cifra</th><th>Binário (MSB)</th></tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </section>
    </template>

    <script src="/socket.io/socket.io.js"></script>
    <script src="scope.js"></script>
    <script src="app.js"></script>
</body>
</html>
